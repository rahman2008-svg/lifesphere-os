workflows:
  android-debug:
    name: LifeSphere OS Stable Build
    max_build_duration: 60

    environment:
      java: 17

    scripts:

      - name: Fix permissions
        script: |
          chmod +x gradlew

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Build Debug APK (NO TESTS)
        script: |
          ./gradlew assembleDebug -x test

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab

    publishing:
      email:
        recipients:
          - "prince.ar.abdur.rahman2008@gmail.com"
