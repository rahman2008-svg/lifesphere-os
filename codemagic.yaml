workflows:
  android-build:
    name: LifeSphere OS Build
    max_build_duration: 60

    environment:
      java: 17

      groups:
        - android_credentials

      vars:
        PACKAGE_NAME: "com.nexvora.lifesphereos"

    scripts:

      - name: Checkout
        script: |
          git clone $CM_REPO_URL .
      
      - name: Set permissions
        script: |
          chmod +x gradlew

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Build Debug APK (skip tests)
        script: |
          ./gradlew assembleDebug -x test

      - name: Build Release APK (optional)
        script: |
          ./gradlew assembleRelease -x test

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab

    publishing:
      email:
        recipients:
          - "prince.ar.abdur.rahman2008@gmail.com"
